# Netlify: the React app (built into dist/) is served from the CDN; only /api/* runs the Node function.
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  # esbuild keeps the function an ES module (the app uses import.meta and dynamic imports)
  node_bundler = "esbuild"

[functions.server]
  # optional: on Pro plans pick the region closest to your users and your Turso database, e.g. "sin"
  # region = "sin"

# The API goes to the function (the Express app)...
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200

# ...and every page is the single-page app (real files in dist/ are served as themselves first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Same security headers as the Express app sends, for pages served straight from the CDN.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=15552000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
